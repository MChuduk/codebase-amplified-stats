<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marquee promo tile</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1400px;
        height: 560px;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        color: #fff;
        background: linear-gradient(120deg, #081f4d 0%, #0b3d91 38%, #0969da 78%, #2f81f7 100%);
        -webkit-font-smoothing: antialiased;
      }

      .tile {
        height: 100%;
        padding: 64px 72px;
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 72px;
        align-items: center;
      }

      header {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      header img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(2, 16, 46, 0.45);
      }

      h1 {
        font-size: 44px;
        letter-spacing: -0.025em;
        font-weight: 700;
      }

      .tagline {
        margin-top: 30px;
        font-size: 26px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.9);
        max-width: 720px;
      }

      .chips {
        margin-top: 34px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .chips span {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 9px 18px;
      }

      figure {
        background: #fff;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 26px 60px rgba(2, 16, 46, 0.45);
      }

      figure img {
        display: block;
        width: 100%;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div>
        <header>
          <img src="../public/icon/128.png" alt="" />
          <h1>Codebase Amplified Stats</h1>
        </header>

        <p class="tagline">
          Real lines of code per language, on any GitHub repository — public or private.
        </p>

        <div class="chips">
          <span>Vendored and generated files excluded</span>
          <span>Code vs comments</span>
          <span>No backend, no telemetry</span>
        </div>
      </div>

      <figure>
        <img src="panel.png" alt="" />
      </figure>
    </div>
  </body>
</html>
