<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Small promo tile</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        color: #fff;
        background: linear-gradient(135deg, #0b2e6f 0%, #0969da 62%, #2f81f7 100%);
        -webkit-font-smoothing: antialiased;
      }

      .tile {
        height: 100%;
        padding: 34px 30px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
      }

      img {
        width: 48px;
        height: 48px;
        border-radius: 13px;
        box-shadow: 0 4px 14px rgba(2, 16, 46, 0.45);
      }

      h1 {
        font-size: 26px;
        letter-spacing: -0.025em;
        font-weight: 700;
        white-space: nowrap;
      }

      p {
        margin-top: 8px;
        font-size: 15px;
        color: rgba(255, 255, 255, 0.85);
        white-space: nowrap;
      }

      .stat {
        display: flex;
        align-items: baseline;
        gap: 10px;
        white-space: nowrap;
      }

      .stat b {
        font-size: 30px;
        letter-spacing: -0.02em;
      }

      .stat span {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <img src="../public/icon/128.png" alt="" />

      <div>
        <h1>Codebase Amplified Stats</h1>
        <p>Lines of code per language, in GitHub's sidebar.</p>
      </div>

      <div class="stat">
        <b>12,404</b>
        <span>lines — not bytes</span>
      </div>
    </div>
  </body>
</html>
